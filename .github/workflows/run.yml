# Finds near-viral posts and queues drafted comments. Started each weekday morning by the
# Apps Script in appscript/Code.gs (GitHub's own schedule trigger never fired for this repo),
# from the Sheet's Reach menu, or by hand. Posting is done by hand with `reach assist`
# (LinkedIn's comment API is partner-only). Needs repository secrets:
# COMPOSIO_API_KEY, COMPOSIO_USER_ID, NVIDIA_API_KEY, SHEET_ID, YOUTUBE_API_KEY.
name: run
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reach
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/reach run -drafts 5
